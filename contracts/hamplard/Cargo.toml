[package]
name = "hamplard"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hamplard — On-chain course enrollment, payments, and certificate issuance on Stellar Soroban"
authors = ["Hamplard Team"]
repository = "https://github.com/hamplard/hamplard"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"
soroban-sdk = { workspace = true, features = ["testutils"] }
