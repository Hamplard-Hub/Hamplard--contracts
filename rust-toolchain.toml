# Pinned toolchain for reproducible builds.
# soroban-sdk =22.0.11 needs >= 1.84.0. CI (.github/workflows/test.yml) installs
# exactly this release, so keep the pin in step with that rustup line.
# Update this version together with soroban-sdk and the workflow rustup lines.
[toolchain]
channel    = "1.84.0"
targets    = ["wasm32v1-none"]
components = ["rustc", "cargo", "rustfmt", "clippy", "rust-src"]
profile    = "minimal"
