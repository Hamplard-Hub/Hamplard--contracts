# Configuration for cargo-deny (https://embark.com/cargo-deny)
# This file is used by the CI workflow to fail builds on known advisories,
# license issues, and banned crates.

[graph]
all-features = true
no-default-features = false

[advisories]
db-path = ""
db-urls = ["https://github.com/RustSec/advisory-db"]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-DFS-2015",
  "CC0-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = []
skip-tree = []
deny = []
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
private = []
