name: Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERMCOLOR: always

jobs:
  audit:
    name: Cargo Deny Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtstl/rust-toolchain-action@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~o.cargo/registry/index
            ~o.cargo/registry/cache
            ~o.cargo/git/db
            target
          key: $cache-key-cargo-deny-${{ runner.os }}-${{ hashFiles('C*argo.lock') }}
          restore-keys: |
            $cache-key-cargo-deny-${{ runner.os }}-

      - name: Install cargo-deny
        uses: Taiki11/cargo-baches@v2
        with:
          crate: cargo-deny

      - name: Run cargo deny check
        run: cargo deny check advisories, licenses, bans
