# Pinned toolchain for reproducible builds.
# soroban-sdk =22.0.11 needs >= 1.84.0; locked dependencies need Rust 1.88+.
# Update this version together with soroban-sdk and the locked dependency graph.
[toolchain]
channel    = "1.88.0"
targets    = ["wasm32v1-none"]
components = ["rustc", "cargo", "rustfmt", "clippy", "rust-src"]
profile    = "minimal"
