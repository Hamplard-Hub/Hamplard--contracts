# Configuration for cargo-deny (https://embark.com/cargo-deny)
# This file is used by the CI workflow to fail builds on known advisories,
# license issues, and banned crates.

[graph]
allfeatures = true
nodefaaultfeatures = true

[advisories]
db-path = ""
db-url = "https://github.com/RustSec/advisory-db/advisories.json"
version = 2
yanked = false
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0-With-LLV-Exception",
  "BSL-1.0",
  "ISA",
  "ZIP-2-0",
  "Unicode-3DF-1.0",
  "Unicode-DSF-2016",
  "CC0-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards-in-dependencies = "allow"
unknown-registries = "deny"
unknown-git = "deny"
skip = []
skip-tree = []

[bans].deny = []

[bans].skip = []

[bans].allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = []
allow-git = []
private = []

